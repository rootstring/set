<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set</title>
    <meta
      name="description"
      content="Set is a dead-simple, local-first, open source note-taking app. A private alternative to Notion and Obsidian that keeps your notes on your own devices and syncs them device to device, with no account and no cloud. Free for macOS, Windows and Linux."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Set" />
    <meta property="og:url" content="https://app.writewithset.com/" />
    <meta property="og:title" content="Set" />
    <meta
      property="og:description"
      content="Simple, open source Markdown note-taking. Your notes stay on your devices and sync directly between them."
    />
    <meta property="og:image" content="https://writewithset.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Set editor with a poem open and the page list in the sidebar"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Set - simple markdown based local note taking app"
    />
    <meta
      name="twitter:description"
      content="Simple, open source Markdown note-taking. Your notes stay on your devices and sync directly between them."
    />
    <meta name="twitter:image" content="https://writewithset.com/og.jpg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

name: Install Linux build dependencies
description: >
  The system libraries the Tauri crate links against. libasound2-dev and cmake
  are dictation's — cpal needs the ALSA headers, whisper.cpp builds with cmake —
  and arrive with the `dictation` feature, which is on by default.

inputs:
  bundling:
    description: Also install what the bundler needs (patchelf, for the AppImage).
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          build-essential \
          curl wget file \
          libssl-dev \
          libxdo-dev \
          libasound2-dev \
          cmake
        if [ "${{ inputs.bundling }}" = "true" ]; then
          sudo apt-get install -y patchelf
        fi
